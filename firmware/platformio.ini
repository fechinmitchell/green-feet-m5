; Green Feet stick firmware (M5StickC Plus, ESP32-PICO-D4)
[env:m5stick-c-plus]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  m5stack/M5StickCPlus@0.1.1
  h2zero/NimBLE-Arduino@1.4.3
build_flags =
  -DFW_VERSION=\"1.3.0\"
